[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-caliper"
version = "0.1.0"
description = "Codex-compliant banana dimensional measurement from a single camera, using ArUco markers for metric calibration."
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
    "scipy",
    "scikit-image",
    "ultralytics",
    "PySide6",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
]

[tool.setuptools.packages.find]
include = ["codex_caliper*"]
