[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-caliper"
version = "0.1.0"
description = "Codex-compliant banana dimensional measurement from a single camera, using ArUco markers for metric calibration."
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy>=2.0",
    "scipy",
    "scikit-image",
    "PySide6",
    "pandas",
]

[project.optional-dependencies]
# Backend de deteccion. Obligatorio para medir en vivo; fuera de las
# dependencias base porque arrastra torch (~2.5 GB) y nada mas del paquete
# lo necesita: el import de ultralytics es perezoso (ver detection.py) y la
# bateria completa de tests corre sin el, inyectando un modelo falso. Asi,
# quien clona el repo para leerlo o para correr los tests no paga 2.5 GB.
live = [
    "ultralytics",
]
dev = [
    "pytest",
    "pytest-qt",
]

[tool.setuptools.packages.find]
include = ["codex_caliper*"]
