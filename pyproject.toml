[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-vision"
version = "0.1.0"
description = "Medicion de bananas contra CODEX STAN 205-1997 usando calibracion metrica con marcadores ArUco."
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
    "scipy",
    "scikit-image",
    "ultralytics",
    "PySide6",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
]

[tool.setuptools.packages.find]
include = ["banana_vision*"]
